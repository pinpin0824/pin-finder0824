name: Update Pin Registry (Daily Full)

# 1日1回(日本時間 朝6時ごろ = UTC 21:00)自動実行 + 手動実行ボタンも有効化
# カテゴリ全体+複数国+多めの上限で、集められる最大量を取得する
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: {}

# GitHub Pagesへの反映に必要な権限
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 必要なライブラリをインストール
        run: pip install requests Pillow

      - name: eBayからデータ取得・精査(フルモード:カテゴリ全体+複数国)
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: python scripts/fetch_and_process.py

      - name: サイトを再生成(Pin Finder / 今買えるピン)
        run: python scripts/build_static_site.py

      - name: サイトを再生成(累積データベース)
        run: python scripts/build_database_site.py

      - name: Jekyllを無効化(.nojekyllを配置)
        run: touch docs/.nojekyll

      - name: 変更をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pins_data.json data/top_characters.json data/archive_data.json docs/index.html docs/.nojekyll docs/images docs/database
          git diff --staged --quiet || git commit -m "フル自動更新: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
